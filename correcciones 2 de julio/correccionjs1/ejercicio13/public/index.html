<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenando con sort()</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Práctica con el método `sort()`</h1>
    </header>

    <main>
        <div id="custom-alert" class="alert hidden"></div>

        <section class="card">
            <h2>Ordenar Números de Menor a Mayor</h2>
            <form id="form-numeros">
                <label for="input-numero">Ingresá un número:</label>
                <input type="text" id="input-numero" placeholder="Ej: 42">
                <button type="submit">Agregar Número</button>
            </form>
            <div class="data-container">
                <h3>Números Ingresados:</h3>
                <div id="lista-numeros" class="data-list"></div>
                <button id="btn-ordenar-numeros">Ordenar Números</button>
            </div>
        </section>

        <section class="card">
            <h2>Ordenar Palabras Alfabéticamente</h2>
            <form id="form-palabras">
                <label for="input-palabra">Ingresá una palabra:</label>
                <input type="text" id="input-palabra" placeholder="Ej: Manzana">
                <button type="submit">Agregar Palabra</button>
            </form>
            <div class="data-container">
                <h3>Palabras Ingresadas:</h3>
                <div id="lista-palabras" class="data-list"></div>
                <button id="btn-ordenar-palabras">Ordenar Palabras</button>
            </div>
        </section>

        <section class="card">
            <h2>Ordenar Personas por Edad</h2>
            <form id="form-personas">
                <div class="form-group">
                    <label for="input-nombre">Nombre:</label>
                    <input type="text" id="input-nombre" placeholder="Ej: Ana">
                </div>
                <div class="form-group">
                    <label for="input-edad">Edad:</label>
                    <input type="text" id="input-edad" placeholder="Ej: 25">
                </div>
                <button type="submit">Agregar Persona</button>
            </form>
            <div class="data-container">
                <h3>Personas Ingresadas:</h3>
                <div id="lista-personas" class="data-list"></div>
                <button id="btn-ordenar-personas">Ordenar por Edad</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Proyecto con HTML, CSS, JavaScript y Node.js (Express)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
