<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decodificador de Mensajes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Decodificador de Mensajes <span class="subtitle">SECRETO</span></h1>
        <p class="description">
            Pega el mensaje codificado en el área de texto. El sistema invertirá el contenido de los fragmentos entre paréntesis para revelar el mensaje original.
        </p>

        <form id="decode-form">
            <label for="encoded-text">Mensaje Codificado:</label>
            <textarea id="encoded-text" rows="6" placeholder="Ej: Hoy (.sh 22 sal a) ..."></textarea>
            
            <div class="real-time-preview">
                <h3>Vista Previa de Entrada:</h3>
                <p id="input-preview">-</p>
            </div>
            
            <button type="submit">Decodificar Mensaje</button>
        </form>

        <div id="result-container">
            <h2>Mensaje Decodificado:</h2>
            <p id="decoded-result">- Aquí aparecerá el resultado -</p>
        </div>
    </main>

    <div id="custom-alert" class="alert">
        <span id="alert-message"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
