<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío: Función filter()</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="alerta-custom" class="alerta" style="display: none;"></div>

    <main class="container">
        <section class="card">
            <h2>1. Filtrar Números > 10</h2>
            <form id="form-numeros">
                <input type="text" id="input-numero" placeholder="Ingresa un número">
                <button type="submit">Agregar Número</button>
            </form>
            <button id="btn-filtrar-numeros" class="btn-filtrar">Filtrar > 10</button>
            <div class="data-container">
                <div>
                    <h3>Números Ingresados:</h3>
                    <ul id="lista-numeros"></ul>
                </div>
                <div>
                    <h3>Resultado del Filtro:</h3>
                    <ul id="resultado-numeros"></ul>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>2. Filtrar Palabras > 5 letras</h2>
            <form id="form-palabras">
                <input type="text" id="input-palabra" placeholder="Ingresa una palabra">
                <button type="submit">Agregar Palabra</button>
            </form>
            <button id="btn-filtrar-palabras" class="btn-filtrar">Filtrar > 5 letras</button>
            <div class="data-container">
                <div>
                    <h3>Palabras Ingresadas:</h3>
                    <ul id="lista-palabras"></ul>
                </div>
                <div>
                    <h3>Resultado del Filtro:</h3>
                    <ul id="resultado-palabras"></ul>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>3. Filtrar Usuarios Activos</h2>
            <form id="form-usuarios">
                <input type="text" id="input-usuario-nombre" placeholder="Nombre del usuario">
                <label>
                    <input type="checkbox" id="input-usuario-activo">
                    ¿Activo?
                </label>
                <button type="submit">Agregar Usuario</button>
            </form>
            <button id="btn-filtrar-usuarios" class="btn-filtrar">Filtrar Activos</button>
            <div class="data-container">
                <div>
                    <h3>Usuarios Ingresados:</h3>
                    <ul id="lista-usuarios"></ul>
                </div>
                <div>
                    <h3>Resultado del Filtro:</h3>
                    <ul id="resultado-usuarios"></ul>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
