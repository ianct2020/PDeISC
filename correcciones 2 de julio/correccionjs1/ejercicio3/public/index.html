<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío: Usando unshift()</title>
    
    <link rel="stylesheet" href="/styles.css">
    
</head>
<body>

    <main>
        <section class="card">
            <h2>1. Agregar Colores</h2>
            <form id="form-colores">
                <input type="text" id="input-color" placeholder="Ej: Rojo" required>
                <button type="submit">Agregar al inicio</button>
            </form>
            <h3>Resultado:</h3>
            <ul id="lista-colores" class="results-list">
                <li class="placeholder">Aún no hay colores...</li>
            </ul>
        </section>

        <section class="card">
            <h2>2. Agregar Tarea Urgente</h2>
            <form id="form-tareas">
                <input type="text" id="input-tarea" placeholder="Ej: Comprar el pan" required>
                <button type="submit">Agregar al inicio</button>
            </form>
            <h3>Resultado:</h3>
            <ul id="lista-tareas" class="results-list">
                 <li class="placeholder">Aún no hay tareas...</li>
            </ul>
        </section>

        <section class="card">
            <h2>3. Agregar Usuario Conectado</h2>
            <form id="form-usuarios">
                <input type="text" id="input-usuario" placeholder="Ej: gaby_dev" required>
                <button type="submit">Agregar al inicio</button>
            </form>
            <h3>Resultado:</h3>
            <ul id="lista-usuarios" class="results-list">
                 <li class="placeholder">Aún no hay usuarios...</li>
            </ul>
        </section>
    </main>

    <div id="custom-alert" class="custom-alert"></div>

    <script src="/script.js"></script>
</body>
</html>
