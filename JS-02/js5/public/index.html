<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Animales del Zoológico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestor de Animales del Zoológico</h1>
            <p>Aplicación web para la administración y consulta de animales.</p>
        </header>

        <main class="main-layout">
            <section class="card form-card">
                <h2>Añadir Nuevo Animal</h2>
                <form id="animalForm" novalidate>
                     <div class="form-group">
                        <label for="nombre">Nombre del Animal</label>
                        <input type="text" id="nombre" required minlength="2">
                        <div class="error-message" id="nombreError"></div>
                    </div>
                    <div class="form-group">
                        <label for="jaula">Número de Jaula</label>
                        <input type="number" id="jaula" min="1" required>
                        <div class="error-message" id="jaulaError"></div>
                    </div>
                    <div class="form-group">
                        <label for="tipo">Tipo de Animal</label>
                        <select id="tipo" required>
                            <option value="1">Felino</option>
                            <option value="2">Ave</option>
                            <option value="3">Reptil</option>
                            <option value="4">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" step="0.1" min="0" required>
                        <div class="error-message" id="pesoError"></div>
                    </div>
                    <button type="submit" class="btn">Agregar Animal</button>
                </form>
            </section>
            <section class="card report-card">
                <h2>Generar Reporte</h2>
                <p>Usa este botón para generar el reporte en una nueva pestaña con todos los datos y consultas.</p>
                <button id="generateReportBtn" class="btn">Mostrar Reporte en Pestaña Nueva</button>
            </section>
        </main>
        
        <footer>
            <p>Desarrollado con HTML, CSS y JavaScript.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
